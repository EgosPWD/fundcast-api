services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: startups
      POSTGRES_USER: startups
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startups"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://startups:${DB_PASSWORD}@db:5432/startups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/srv/artifacts
      - ./data/uploads:/srv/data/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
