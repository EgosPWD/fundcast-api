services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: startups
      POSTGRES_USER: startups
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startups"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://startups:${DB_PASSWORD}@db:5432/startups
      # Relative to WORKDIR /srv, where ./data is mounted. Override it from the shell to
      # seed another CSV, e.g. SEED_DATASET_PATH=./data/demo/seed.csv (teacher demo).
      SEED_DATASET_PATH: ${SEED_DATASET_PATH-./data/global_startup_funding_sample.csv}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/srv/artifacts
      # The whole data/ folder: the original CSV (seed), the demo split and uploads/.
      - ./data:/srv/data
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
